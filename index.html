<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Drift</title>
    <script src="//tympanus.net/codrops/adpacks/analytics.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #000;
      }

      input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-runnable-track,
      input[type="range"]::-moz-range-track {
        border: 0;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
      }

      input[type="range"]::-moz-range-thumb {
        border: 0;
        background: transparent;
      }

      .hero-top-bar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 5;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 0.3rem 0;
      }

      .hero-lottie {
        display: flex;
        align-items: flex-start;
        gap: 0.2rem;
      }

      .rhodes-audio-control {
        display: flex;
        justify-content: flex-end;
        margin-top: 1rem;
        margin-right: 2rem;
        padding: 0;
      }

      .rhodes-audio-button {
        display: grid;
        box-sizing: border-box;
        width: auto;
        min-width: 104px;
        height: 28px;
        place-items: center;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.58);
        border-radius: 999px;
        color: #fff;
        background: #000;
        font: 11px/1 "DM Sans", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.04em;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        background: #000;
        pointer-events: none;
      }

      #boot-loader i {
        display: block;
        width: 100%;
        height: 1px;
        flex: 0 0 1px;
        background: rgba(255, 255, 255, calc(var(--boot-line-alpha) * 0.78));
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <i style="--boot-line-alpha: 0.42"></i>

      <i style="--boot-line-alpha: 0.13"></i>
      <i style="--boot-line-alpha: 0.12"></i>
      <i style="--boot-line-alpha: 0.11"></i>
      <i style="--boot-line-alpha: 0.10"></i>

</html>
