<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Sphere Row Letter Beams</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../assets/pen-control-panel-light.css" />
  </head>
  <body class="pen-control-panel-light">
    <div id="app"></div>

    <aside class="controls">
      <div class="controls__block">
        <p class="eyebrow">Three.js Beam Study</p>
        <h1>Sphere Row Letter Beams</h1>
        <p class="status" id="statusText">
          Repeated letter rows wrap a sphere while beam lines pull every point back to the center.
        </p>
      </div>

      <div class="controls__block">
        <label for="sequenceInput">Letter Sequence</label>
        <textarea id="sequenceInput" rows="4">A
R
T
E</textarea>

        <label for="glyphAmountRange">Glyph Amount <span id="glyphAmountVal"></span></label>
        <input id="glyphAmountRange" type="range" min="1" max="16" step="1" value="16" />
      </div>

      <div class="controls__block">
        <label for="fontStyleSelect">Font Style</label>
        <select id="fontStyleSelect">
          <option value="arial-black" selected>Arial Black</option>
          <option value="dm-sans">DM Sans Bold</option>
          <option value="georgia">Georgia Bold</option>
          <option value="courier">Courier Bold</option>
        </select>

        <label for="radiusRange">Sphere Radius <span id="radiusVal"></span></label>
        <input id="radiusRange" type="range" min="1.6" max="5.5" step="0.01" value="3.35" />

        <label for="textScaleRange">Glyph Scale <span id="textScaleVal"></span></label>
        <input id="textScaleRange" type="range" min="8" max="10" step="0.01" value="8" />

        <label for="poleShrinkRange">Pole Shrink <span id="poleShrinkVal"></span></label>
        <input id="poleShrinkRange" type="range" min="0" max="1" step="0.01" value="0" />

        <label for="densityRange">Pixel Density <span id="densityVal"></span></label>
        <input id="densityRange" type="range" min="0.1" max="1" step="0.01" value="1" />

        <label for="pointSizeRange">Point Size <span id="pointSizeVal"></span></label>
        <input id="pointSizeRange" type="range" min="0.002" max="0.1" step="0.001" value="0.1" />
      </div>

      <div class="controls__block">
        <label for="beamAlphaRange">Beam Alpha <span id="beamAlphaVal"></span></label>
        <input id="beamAlphaRange" type="range" min="0.02" max="0.8" step="0.01" value="0.14" />

        <label for="beamDensityRange">Beam Density <span id="beamDensityVal"></span></label>
        <input id="beamDensityRange" type="range" min="0.05" max="1" step="0.01" value="0.35" />

        <label for="beamFadeRange">Center Fade <span id="beamFadeVal"></span></label>
        <input id="beamFadeRange" type="range" min="0" max="0.92" step="0.01" value="0.9" />

        <label for="beamJitterRange">Beam Jitter <span id="beamJitterVal"></span></label>
        <input id="beamJitterRange" type="range" min="0" max="0.6" step="0.01" value="0" />

        <label for="pulseRange">Pulse <span id="pulseVal"></span></label>
        <input id="pulseRange" type="range" min="0" max="1.8" step="0.01" value="0" />

        <label for="morphDurationRange">Relocation Speed <span id="morphDurationVal"></span></label>
        <input id="morphDurationRange" type="range" min="0.6" max="10" step="0.1" value="6" />

        <label for="holdDurationRange">Hold Duration <span id="holdDurationVal"></span></label>
        <input id="holdDurationRange" type="range" min="0.2" max="4" step="0.1" value="0.9" />

        <label for="travelModeSelect">Point Travel</label>
        <select id="travelModeSelect">
          <option value="horizontal" selected>Horizontal</option>
          <option value="alternate-horizontal">Alternate Horizontal</option>
          <option value="diagonal">Diagonal</option>
          <option value="alternate-diagonal">Alternate Diagonal</option>
          <option value="random">Random</option>
        </select>
      </div>

      <div class="controls__block">
        <label for="rotationSpeedRange">Rotation Loop <span id="rotationSpeedVal"></span></label>
        <input id="rotationSpeedRange" type="range" min="2" max="40" step="0.1" value="24" />

        <label for="rotationEaseSelect">Rotation Smooth</label>
        <select id="rotationEaseSelect">
          <option value="linear">Linear</option>
          <option value="soft" selected>Soft</option>
          <option value="softer">Softer</option>
          <option value="glide">Glide</option>
        </select>

        <label for="tiltRange">Tilt <span id="tiltVal"></span></label>
        <input id="tiltRange" type="range" min="-60" max="60" step="1" value="-18" />

        <label class="checkline">
          <input id="pauseCheck" type="checkbox" />
          <span>Pause Morph</span>
        </label>
      </div>

      <div class="controls__block controls__actions">
        <button id="rebuildBtn" type="button">Rebuild</button>
        <button id="nextBtn" type="button">Next Letter</button>
      </div>
    </aside>

    <script type="module" src="script.js"></script>
  </body>
</html>
